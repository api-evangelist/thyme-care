aid: thyme-care
name: Thyme Care
description: >-
  Thyme Care is a value-based oncology care-navigation and support company that
  partners with health plans, providers, and employers to guide people through a
  cancer diagnosis and treatment. Its virtual oncology care team and navigators
  help members access care, coordinate with treating physicians, manage symptoms
  and side effects, understand costs, and improve outcomes across the cancer
  journey. Thyme Care delivers this through partner programs (Thyme Care Connect,
  Thyme Care Signal, Thyme Box, and Enhanced Supportive Care) rather than a public
  developer platform. As of this enrichment pass, no public developer portal, API
  documentation, SDKs, or /.well-known API-discovery surface were found for Thyme
  Care; it is profiled here as a company, not an API provider.
